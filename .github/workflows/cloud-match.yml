name: Distributed bullet match
run-name: ${{ inputs.trial_id || (inputs.controller_action != '' && format('SPSA {0} {1}', inputs.controller_campaign_id, inputs.controller_action)) || 'Distributed bullet match' }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch, tag, or commit
        required: true
        default: codex/bullet-beast
        type: string
      baseline_ref:
        description: Baseline branch, tag, or commit
        required: true
        default: 839f9f0dd442b3a3f89ce2c87fc815ae1d6d4fc2
        type: string
      games:
        description: Total games (exactly 2 * suite positions * repeats)
        required: true
        default: 2000
        type: number
      opening_start:
        description: One-based first suite position for the cloud lane
        required: true
        default: 1
        type: number
      opening_repeats:
        description: Explicit complete cycles over the opening suite
        required: true
        default: 10
        type: number
      opening_suite_positions:
        description: Number of consecutive opening positions in each complete cycle
        required: true
        default: 100
        type: number
      shards:
        description: Parallel runners (1-40)
        required: true
        default: 40
        type: number
      concurrency:
        description: Concurrent games per runner (1-4; engines remain single-threaded)
        required: true
        default: 2
        type: number
      time_control:
        description: CuteChess base+increment in seconds
        required: true
        default: 0.5+0
        type: string
      threads:
        description: Threads per engine (1-2)
        required: true
        default: 1
        type: number
      hash_mb:
        description: Hash MB per engine
        required: true
        default: 16
        type: number
      elo0:
        description: SPRT lower Elo hypothesis
        required: true
        default: 0
        type: number
      elo1:
        description: SPRT upper Elo hypothesis
        required: true
        default: 5
        type: number
      stockfish_elo:
        description: Use Stockfish as baseline with this UCI_Elo rating
        required: false
        default: ''
        type: string
      baseline_initstr:
        description: Optional baseline UCI initialization override
        required: false
        default: ''
        type: string
      candidate_initstr:
        description: Optional candidate UCI initialization override
        required: false
        default: ''
        type: string
      match_config:
        description: Trusted repository-relative base match configuration
        required: false
        default: config/cloud/default-match.json
        type: string
      trial_id:
        description: Optional immutable tuning trial identity
        required: false
        default: ''
        type: string
      controller_action:
        description: Optional reusable SPSA entry point (tune or qualify)
        required: false
        default: ''
        type: string
      controller_campaign_id:
        required: false
        default: ''
        type: string
      controller_engine_ref:
        required: false
        default: ''
        type: string
      controller_config_path:
        required: false
        default: ''
        type: string
      controller_state_run_id:
        required: false
        default: ''
        type: string
      callback_payload:
        description: Optional compact trusted SPSA callback descriptor
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cloud-match-${{ github.ref }}-${{ inputs.controller_action }}-${{ inputs.controller_campaign_id }}-${{ inputs.trial_id }}-${{ inputs.candidate_ref }}-${{ inputs.baseline_ref }}
  cancel-in-progress: false

jobs:
  controller-tune:
    if: ${{ inputs.controller_action == 'tune' }}
    uses: ./.github/workflows/spsa-tune.yml
    with:
      campaign_id: ${{ inputs.controller_campaign_id }}
      engine_ref: ${{ inputs.controller_engine_ref }}
      config_path: ${{ inputs.controller_config_path }}
      state_run_id: ${{ inputs.controller_state_run_id }}

  controller-qualify:
    if: ${{ inputs.controller_action == 'qualify' }}
    uses: ./.github/workflows/spsa-qualify.yml
    with:
      campaign_id: ${{ inputs.controller_campaign_id }}
      engine_ref: ${{ inputs.controller_engine_ref }}
      config_path: ${{ inputs.controller_config_path }}
      state_run_id: ${{ inputs.controller_state_run_id }}

  prepare:
    if: ${{ inputs.controller_action == '' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.spec.outputs.matrix }}
      experiment_id: ${{ steps.spec.outputs.experiment_id }}
      candidate_commit: ${{ steps.spec.outputs.candidate_commit }}
      baseline_commit: ${{ steps.spec.outputs.baseline_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/cloud_match/requirements.txt
      - run: pip install -r tools/cloud_match/requirements.txt
      - name: Validate cloud tooling
        run: python -m unittest discover -s tools/cloud_match -p "test_*.py" -v
      - name: Validate optional controller callback
        shell: bash
        env:
          CALLBACK_PAYLOAD: ${{ inputs.callback_payload }}
        run: |
          set -euo pipefail
          if [ -n "$CALLBACK_PAYLOAD" ]; then
            test "$(jq -r 'keys | sort | join(",")' <<< "$CALLBACK_PAYLOAD")" = \
              action,campaign_id,config_path,engine_ref,ref,state_run_id,workflow
            CALLBACK_WORKFLOW="$(jq -er .workflow <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_ACTION="$(jq -er .action <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_REF="$(jq -er .ref <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_CAMPAIGN_ID="$(jq -er .campaign_id <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_ENGINE_REF="$(jq -er .engine_ref <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_CONFIG_PATH="$(jq -er .config_path <<< "$CALLBACK_PAYLOAD")"
            CALLBACK_STATE_RUN_ID="$(jq -er .state_run_id <<< "$CALLBACK_PAYLOAD")"
            test "$CALLBACK_WORKFLOW" = cloud-match.yml
            [[ "$CALLBACK_ACTION" =~ ^(tune|qualify)$ ]]
            [[ "$CALLBACK_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$CALLBACK_CAMPAIGN_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
            [[ "$CALLBACK_ENGINE_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CALLBACK_CONFIG_PATH" =~ ^config/spsa/[A-Za-z0-9._/-]+\.json$ ]]
            [[ "$CALLBACK_STATE_RUN_ID" =~ ^[0-9]+$ ]]
          fi
      - name: Freeze match specification
        id: spec
        shell: bash
        env:
          BASE_CONFIG: ${{ inputs.match_config }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CANDIDATE_INITSTR: ${{ inputs.candidate_initstr }}
          BASELINE_INITSTR: ${{ inputs.baseline_initstr }}
          STOCKFISH_ELO: ${{ inputs.stockfish_elo }}
          TIME_CONTROL: ${{ inputs.time_control }}
        run: |
          set -euo pipefail
          args=(
            --base "$BASE_CONFIG"
            --output prepared/spec.json
            --candidate-ref "$CANDIDATE_REF"
            --baseline-ref "$BASELINE_REF"
            --games '${{ inputs.games }}'
            --opening-start '${{ inputs.opening_start }}'
            --opening-repeats '${{ inputs.opening_repeats }}'
            --opening-suite-positions '${{ inputs.opening_suite_positions }}'
            --shards '${{ inputs.shards }}'
            --concurrency '${{ inputs.concurrency }}'
            --time-control "$TIME_CONTROL"
            --threads '${{ inputs.threads }}'
            --hash-mb '${{ inputs.hash_mb }}'
            --repo-root .
            --elo0 '${{ inputs.elo0 }}'
            --elo1 '${{ inputs.elo1 }}'
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "$CANDIDATE_INITSTR" ]; then
            args+=(--candidate-initstr "$CANDIDATE_INITSTR")
          fi
          if [ -n "$BASELINE_INITSTR" ]; then
            args+=(--baseline-initstr "$BASELINE_INITSTR")
          elif [ -n "$STOCKFISH_ELO" ]; then
            args+=(--baseline-initstr "UCI_Elo=$STOCKFISH_ELO")
          fi
          python -m tools.cloud_match.prepare "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: match-spec-${{ steps.spec.outputs.experiment_id }}
          path: prepared/spec.json
          retention-days: 1
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          path: farm-src
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          # Fetch the submitted ref, then verify its resolved commit below.
          # GitHub may reject direct SHA fetches for commits in a shallow history.
          ref: ${{ inputs.candidate_ref }}
          path: candidate-src
          submodules: recursive
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline-src
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: match-spec-${{ needs.prepare.outputs.experiment_id }}
          path: prepared
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ make
      - name: Freeze official Cute Chess 1.5.1 runner
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output cutechess.AppImage \
            https://github.com/cutechess/cutechess/releases/download/v1.5.1/Cute_Chess-1.5.1-x86_64.AppImage
          echo 'd9448693e45bd57f1aeb32c46e94466894cd7cc5b6937effd285a02e871387b5  cutechess.AppImage' | sha256sum --check
          chmod +x cutechess.AppImage
          ./cutechess.AppImage --appimage-extract >/dev/null
          runner="$(find squashfs-root -type f -name cutechess-cli -print -quit)"
          test -n "$runner"
          chmod +x "$runner"
          mkdir -p bundle
          mv squashfs-root bundle/cutechess-root
          cp farm-src/tools/cloud_match/cutechess-appimage-wrapper.sh bundle/cutechess-cli
          chmod +x bundle/cutechess-cli
      - name: Build candidate and baseline
        shell: bash
        env:
          STOCKFISH_ELO: ${{ inputs.stockfish_elo }}
        run: |
          mkdir -p candidate-src/build/blaze bundle
          make -C candidate-src -f Makefile.blaze blaze -j2
          cp candidate-src/build/blaze/blaze.exe bundle/candidate
          chmod +x bundle/candidate
          if [ -n "$STOCKFISH_ELO" ]; then
            curl --fail --location --retry 3 \
              -o stockfish.tar \
              'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar'
            tar -xf stockfish.tar
            stockfish_bin="$(find stockfish -type f -name 'stockfish-*' | head -1)"
            cp "$stockfish_bin" bundle/baseline
            chmod +x bundle/baseline
          elif [ "$(git -C candidate-src rev-parse HEAD)" = "$(git -C baseline-src rev-parse HEAD)" ]; then
            cp bundle/candidate bundle/baseline
          else
            mkdir -p baseline-src/build/blaze
            make -C baseline-src -f Makefile.blaze blaze -j2 \
              RELEASE_FLAGS='-std=c++20 -O3 -DNDEBUG -DNNUE_EMBEDDING_OFF -Wall -Wextra -Wpedantic -Wno-empty-body -Isrc'
            cp baseline-src/build/blaze/blaze.exe bundle/baseline
          fi
          cp prepared/spec.json bundle/spec.json
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          spec = json.loads(Path('prepared/spec.json').read_text(encoding='utf-8'))
          source = (Path('candidate-src') / spec['openings']).resolve()
          if not source.is_file() or Path('candidate-src').resolve() not in source.parents:
              raise SystemExit(f"invalid opening path: {source}")
          destination = Path('bundle') / spec['openings']
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, destination)
          PY
          git -C candidate-src rev-parse HEAD > bundle/candidate-commit.txt
          git -C baseline-src rev-parse HEAD > bundle/baseline-commit.txt
          candidate_sha256="$(sha256sum bundle/candidate | awk '{print $1}')"
          baseline_sha256="$(sha256sum bundle/baseline | awk '{print $1}')"
          candidate_commit="$(cat bundle/candidate-commit.txt)"
          baseline_commit="$(cat bundle/baseline-commit.txt)"
          if [ -z "$STOCKFISH_ELO" ] && [ "$candidate_commit" = "$baseline_commit" ] && \
             [ "$candidate_sha256" != "$baseline_sha256" ]; then
            echo "ERROR: same-commit SPSA engines are not byte-identical" >&2
            exit 1
          fi
          CANDIDATE_SHA256="$candidate_sha256" BASELINE_SHA256="$baseline_sha256" \
            CANDIDATE_COMMIT="$candidate_commit" BASELINE_COMMIT="$baseline_commit" \
            PYTHONPATH=farm-src python - <<'PY'
          import os
          from pathlib import Path
          from tools.cloud_match.prepare import finalize_frozen_spec
          from tools.cloud_match.spec import CloudMatchSpec

          path = Path("bundle/spec.json")
          prepared = CloudMatchSpec.from_json(path)
          if prepared.candidate_commit != os.environ["CANDIDATE_COMMIT"]:
              raise SystemExit("candidate checkout does not match prepared commit")
          if prepared.baseline_commit != os.environ["BASELINE_COMMIT"]:
              raise SystemExit("baseline checkout does not match prepared commit")
          finalize_frozen_spec(
              path,
              candidate_sha256=os.environ["CANDIDATE_SHA256"],
              baseline_sha256=os.environ["BASELINE_SHA256"],
          )
          PY
          chmod +x bundle/candidate bundle/baseline bundle/cutechess-cli
      - name: Fetch NNUE networks and smoke-test both engines
        shell: bash
        run: |
          set -euo pipefail
          spec="bundle/spec.json"
          for key in candidate_initstr baseline_initstr; do
            val="$(jq -r ".$key // \"\"" "$spec")"
            if [[ -z "$val" ]]; then
              echo "ERROR: $key is empty in spec" >&2
              exit 1
            fi
            if ! grep -qx 'UseNNUE=true' <<< "$val"; then
              continue
            fi
            file="$(echo "$val" | sed -n 's/.*EvalFile=\(\S\+\).*/\1/p')"
            if [[ -z "$file" ]]; then
              file="$(echo "$val" | grep -oP 'EvalFile=\K\S+' || true)"
            fi
            if [[ -z "$file" ]]; then
              echo "ERROR: cannot extract EvalFile from $key='$val'" >&2
              exit 1
            fi
            echo "Fetching $file …"
            curl --fail --location --retry 3 \
              -o "bundle/$file" \
              "https://tests.stockfishchess.org/api/nn/$file"
            got="$(sha256sum "bundle/$file" | awk '{print $1}')"
          expected_prefix="${file%.nnue}"
          expected_prefix="${expected_prefix#nn-}"
          if [[ "$got" != "$expected_prefix"* ]]; then
            echo "ERROR: $file SHA-256 $got does not start with $expected_prefix" >&2
              exit 1
            fi
            echo "$got  bundle/$file" >> bundle/nnue-sha256.txt
          done
          # EvalFile is a bare filename, so engines resolve it from the job root.
          cp bundle/*.nnue .
          for name in candidate baseline; do
            binary="bundle/$name"
            initstr="$(jq -r ".${name}_initstr" "$spec")"
            echo "Smoke-testing $name …"
            output=$({
              printf 'uci\n'
              while IFS= read -r setting; do
                [[ -z "$setting" ]] && continue
                printf 'setoption name %s value %s\n' "${setting%%=*}" "${setting#*=}"
              done <<< "$initstr"
              printf 'isready\nucinewgame\nposition startpos\ngo movetime 500\nquit\n'
            } | timeout 15 "$binary" 2>/dev/null || true)
            if echo "$output" | grep -q 'bestmove 0000'; then
              echo "ERROR: $name returned bestmove 0000" >&2
              echo "$output" | tail -5
              exit 1
            fi
            if ! echo "$output" | grep -qP 'bestmove [a-h][1-8][a-h][1-8]'; then
              echo "ERROR: $name did not return a legal bestmove" >&2
              echo "$output" | tail -5
              exit 1
            fi
            echo "$name smoke-test PASSED"
          done
          echo "All engine preflight checks passed"
          printf '%s\n' "$(( $(date +%s) + 180 ))" > bundle/shard-start-epoch.txt
          tar -czf frozen-match.tar.gz -C bundle .
      - name: Verify frozen artifact hashes
        run: sha256sum bundle/candidate bundle/baseline bundle/cutechess-cli bundle/*.nnue bundle/nnue-sha256.txt frozen-match.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-match-${{ needs.prepare.outputs.experiment_id }}
          path: frozen-match.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: finalized-match-spec-${{ needs.prepare.outputs.experiment_id }}
          path: bundle/spec.json
          retention-days: 1
          if-no-files-found: error

  shards:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/cloud_match/requirements.txt
      - run: pip install -r tools/cloud_match/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-match-${{ needs.prepare.outputs.experiment_id }}
          path: frozen
      - name: Unpack immutable artifacts
        run: |
          mkdir bundle
          tar -xzf frozen/frozen-match.tar.gz -C bundle
          chmod +x bundle/candidate bundle/baseline bundle/cutechess-cli
          cp bundle/*.nnue .
      - name: Synchronize shard start without API polling
        shell: bash
        run: |
          set -euo pipefail
          gate="$(cat bundle/shard-start-epoch.txt)"
          [[ "$gate" =~ ^[0-9]+$ ]]
          now="$(date +%s)"
          if [ "$gate" -gt "$now" ]; then
            sleep "$((gate - now))"
          fi
      - name: Run shard ${{ matrix.shard }}
        shell: bash
        run: |
          python -m tools.cloud_match.worker \
            --spec bundle/spec.json \
            --shard-index '${{ matrix.shard }}' \
            --candidate bundle/candidate \
            --baseline bundle/baseline \
            --runner bundle/cutechess-cli \
            --output 'shard-${{ matrix.shard }}' \
            --source-commit "$(cat bundle/candidate-commit.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ needs.prepare.outputs.experiment_id }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error

  aggregate:
    if: ${{ always() && needs.shards.result == 'success' }}
    needs: [prepare, build, shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/cloud_match/requirements.txt
      - run: pip install -r tools/cloud_match/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: finalized-match-spec-${{ needs.prepare.outputs.experiment_id }}
          path: finalized
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ needs.prepare.outputs.experiment_id }}-*
          path: downloaded-shards
      - name: Strictly aggregate every shard
        shell: bash
        run: |
          mapfile -t manifests < <(find downloaded-shards -name shard.json -type f | sort)
          python -m tools.cloud_match.aggregate \
            --spec finalized/spec.json \
            --shards "${manifests[@]}" \
            --output summary \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT"
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ needs.prepare.outputs.experiment_id }}
          path: summary
          retention-days: 90
          if-no-files-found: error
      - name: Resume SPSA controller after evidence is durable
        if: ${{ inputs.callback_payload != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALLBACK_PAYLOAD: ${{ inputs.callback_payload }}
        run: |
          CALLBACK_WORKFLOW="$(jq -er .workflow <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_ACTION="$(jq -er .action <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_REF="$(jq -er .ref <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_CAMPAIGN_ID="$(jq -er .campaign_id <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_ENGINE_REF="$(jq -er .engine_ref <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_CONFIG_PATH="$(jq -er .config_path <<< "$CALLBACK_PAYLOAD")"
          CALLBACK_STATE_RUN_ID="$(jq -er .state_run_id <<< "$CALLBACK_PAYLOAD")"
          for _ in {1..10}; do
            if gh workflow run "$CALLBACK_WORKFLOW" \
              --ref "$CALLBACK_REF" \
              -f "controller_action=$CALLBACK_ACTION" \
              -f "controller_campaign_id=$CALLBACK_CAMPAIGN_ID" \
              -f "controller_engine_ref=$CALLBACK_ENGINE_REF" \
              -f "controller_config_path=$CALLBACK_CONFIG_PATH" \
              -f "controller_state_run_id=$CALLBACK_STATE_RUN_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: evidence is durable but the SPSA callback could not be dispatched" >&2
          exit 1
